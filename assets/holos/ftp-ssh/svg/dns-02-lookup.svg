<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<title>주소창에 이름을 치면 일어나는 일 — DNS 조회</title>
<rect x="0" y="0" width="1200" height="675" fill="#FFFFFF"/>
<text x="600.0" y="54" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F3A5F">주소창에 이름을 치면 일어나는 일 — DNS 조회</text>
<line x1="540.0" y1="72" x2="660.0" y2="72" stroke="#2B4C7E" stroke-width="3" stroke-linecap="round"/>
<rect x="60" y="150" width="250" height="120" rx="14" fill="#F6F8FB" stroke="#2B4C7E" stroke-width="2.5" opacity="1"/>
<text x="185" y="190" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1F2937">내 컴퓨터</text>
<text x="185" y="218" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#6B7280">브라우저가 주소창의</text>
<text x="185" y="238" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#6B7280">이름을 숫자 주소로 바꿔야 함</text>
<rect x="400" y="150" width="300" height="120" rx="14" fill="#E8F0F8" stroke="#2B4C7E" stroke-width="2.5" opacity="1"/>
<text x="550" y="190" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1F3A5F">리졸버 (DNS 서버)</text>
<text x="550" y="218" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#6B7280">통신사·학교·회사가 운영, 또는</text>
<text x="550" y="238" font-family="Noto Sans Mono CJK KR, D2Coding, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="middle" fill="#6B7280">8.8.8.8 · 1.1.1.1 같은 공개 서버</text>
<rect x="820" y="100" width="320" height="64" rx="14" fill="#F6F8FB" stroke="#9CA3AF" stroke-width="1.5" opacity="1"/>
<text x="980" y="126" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">루트 네임서버 ( . )</text>
<text x="980" y="150" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#6B7280">".net은 저쪽 서버가 안다"</text>
<rect x="820" y="200" width="320" height="64" rx="14" fill="#F6F8FB" stroke="#9CA3AF" stroke-width="1.5" opacity="1"/>
<text x="980" y="226" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">.net 최상위 네임서버</text>
<text x="980" y="250" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#6B7280">"epiph.net은 Hostinger 네임서버가 안다"</text>
<rect x="820" y="300" width="320" height="78" rx="14" fill="#E7F4EC" stroke="#1E6B4A" stroke-width="2.5" opacity="1"/>
<text x="980" y="328" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1E6B4A">epiph.net 권한 네임서버</text>
<text x="980" y="350" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#6B7280">(Hostinger) 소유자가 적어 둔 레코드 보관</text>
<text x="980" y="368" font-family="Noto Sans Mono CJK KR, D2Coding, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="middle" fill="#1E6B4A">"202599999.holos → 203.0.113.10"</text>
<line x1="312" y1="196" x2="382.0" y2="196.0" stroke="#2B4C7E" stroke-width="3.5" stroke-linecap="round"/>
<polygon points="396,196 382.0,188.3 382.0,203.7" fill="#2B4C7E"/>
<circle cx="354" cy="178" r="13" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2.5"/>
<text x="354" y="183" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="354" y="138" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#2B4C7E">이 이름의 주소는?</text>
<line x1="704" y1="180" x2="805.8894046698014" y2="136.33311228437086" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="816,132 803.5,130.8 808.3,141.9" fill="#6B7280"/>
<circle cx="748" cy="142" r="13" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2.5"/>
<text x="748" y="147" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<line x1="704" y1="206" x2="805.2849307973231" y2="229.51257322080716" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="816,232 806.7,223.6 803.9,235.4" fill="#6B7280"/>
<circle cx="748" cy="226" r="13" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2.5"/>
<text x="748" y="231" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<line x1="704" y1="236" x2="806.9690796635175" y2="326.0979447055778" stroke="#1E6B4A" stroke-width="3" stroke-linecap="round"/>
<polygon points="816,334 811.3,321.1 802.6,331.1" fill="#1E6B4A"/>
<circle cx="748" cy="300" r="13" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2.5"/>
<text x="748" y="305" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
<line x1="396" y1="240" x2="326.0" y2="240.0" stroke="#1E6B4A" stroke-width="3" stroke-linecap="round"/>
<polygon points="312,240 326.0,247.7 326.0,232.3" fill="#1E6B4A"/>
<circle cx="354" cy="262" r="13" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2.5"/>
<text x="354" y="267" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
<text x="354" y="296" font-family="Noto Sans Mono CJK KR, D2Coding, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="middle" fill="#1E6B4A">203.0.113.10 (TTL 동안 기억)</text>
<rect x="400" y="440" width="300" height="110" rx="14" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2.5" opacity="1"/>
<text x="550" y="478" font-family="Noto Sans Mono CJK KR, D2Coding, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="19" font-weight="700" text-anchor="middle" fill="#1F3A5F">웹 서버 203.0.113.10</text>
<text x="550" y="504" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#6B7280">Replit · 공유호스팅 · VPS 어디든</text>
<text x="550" y="526" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#6B7280">이 숫자 주소를 가진 컴퓨터</text>
<line x1="185" y1="274" x2="185" y2="495" stroke="#1F3A5F" stroke-width="3.5" stroke-linecap="round"/>
<line x1="185" y1="495" x2="382.0" y2="495.0" stroke="#1F3A5F" stroke-width="3.5" stroke-linecap="round"/>
<polygon points="396,495 382.0,487.3 382.0,502.7" fill="#1F3A5F"/>
<circle cx="185" cy="380" r="13" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2.5"/>
<text x="185" y="385" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">6</text>
<text x="215" y="385" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1F3A5F">숫자 주소로 접속 (HTTPS, 443번 문)</text>
<rect x="760" y="420" width="380" height="150" rx="14" fill="#FFF4E0" stroke="#F3D7A3" stroke-width="2" opacity="1"/>
<text x="950" y="450" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#B45309">캐시와 전파</text>
<text x="950" y="478" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">한 번 알아낸 답은 TTL(예: 1시간) 동안</text>
<text x="950" y="500" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">리졸버와 브라우저가 기억합니다.</text>
<text x="950" y="522" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">그래서 레코드를 바꾸면 모든 곳에</text>
<text x="950" y="544" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">퍼지는 데 시간이 걸립니다(전파).</text>
<text x="600" y="625" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#6B7280">2~4번은 리졸버가 알아서 합니다. 내 컴퓨터는 1번을 묻고 5번 답을 받을 뿐입니다. 보통 수십 밀리초면 끝납니다.</text>
</svg>
